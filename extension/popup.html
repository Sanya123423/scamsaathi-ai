<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScamSaathi - Cyber Threat Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-shield" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">ScamSaathi</div>
          <div class="brand-tagline">Think Before You Click</div>
        </div>
      </div>
      <div class="status-indicator" id="ext-backend-status" title="Flask Backend Connection Status">
        <span class="status-dot" id="ext-status-dot"></span>
        <span class="status-text" id="ext-status-text">Backend</span>
      </div>
    </header>

    <!-- Mode Tabs -->
    <div class="tabs-nav" role="tablist">
      <button class="tab-btn active" data-tab="tab-active-url" role="tab">Current Page</button>
      <button class="tab-btn" data-tab="tab-msg" role="tab">Inspect Text</button>
    </div>

    <!-- Tab 1: Current Page URL Inspection -->
    <div class="tab-pane active" id="tab-active-url">
      <div class="form-group">
        <label class="form-label">Current Tab Webpage URL:</label>
        <div class="url-field-wrap">
          <input type="text" id="ext-current-url" class="form-input" placeholder="Loading tab URL..." spellcheck="false" />
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="btn-ext-scan-url">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Inspect Page Link</span>
      </button>
    </div>

    <!-- Tab 2: Suspicious Message / Text Analysis -->
    <div class="tab-pane" id="tab-msg">
      <div class="form-group">
        <label class="form-label">Paste SMS, Offer, or Email Text:</label>
        <textarea id="ext-message-input" class="form-textarea" rows="3" placeholder="e.g. 'Your account will be suspended. Share OTP...' or 'बिजली बिल जमा करें...'"></textarea>
      </div>
      <button type="button" class="btn btn-primary" id="btn-ext-scan-msg">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <span>Analyze Threat Signals</span>
      </button>
    </div>

    <!-- Results Section -->
    <div class="results-container hidden" id="ext-results-container">
      <div class="result-card">
        <div class="result-header">
          <div class="score-display">
            <span class="score-number" id="ext-score-num">0</span>
            <span class="score-max">/100</span>
          </div>
          <span class="badge badge-low" id="ext-severity-badge">LOW RISK</span>
        </div>

        <div class="threat-summary" id="ext-threat-summary">No immediate threat patterns detected.</div>

        <div class="indicators-box hidden" id="ext-indicators-box">
          <div class="indicators-title">Forensic Indicators:</div>
          <div class="indicators-list" id="ext-indicators-list"></div>
        </div>

        <div class="safety-box">
          <div class="safety-title">Recommended Action:</div>
          <div class="safety-text" id="ext-safety-advice">Always verify before providing credentials or making payments.</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <a href="http://127.0.0.1:5000" target="_blank" class="footer-link">Open Full Dashboard &rsaquo;</a>
      <span class="helpline-tag">Helpline: <strong>1930</strong></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
